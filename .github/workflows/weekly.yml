name: Weekly Update

on:
  schedule:
    # 04:00 UTC Tuesday = Monday 23:00 Central (CDT, UTC-5).
    # During CST (UTC-6, roughly Nov-Mar) this runs at 22:00 Central instead of 23:00,
    # since GitHub Actions cron is always UTC and doesn't shift for DST.
    - cron: '0 4 * * 2'
  workflow_dispatch:

jobs:
  update-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_db.py update

      - name: Retrain model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python retrain.py

      - name: Upload model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_model.py

      - name: Backfill model xG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backfill_xg.py